# Illustrative starter DNA for the first channel. Data only: no logic lives in YAML.
# Secrets are referenced by environment-variable NAME; values live in GitHub Secrets.
config_version: "1.0"
channel: drama
display_name: Drama
lifecycle_state: TEST        # IDEA | TEST | EVALUATING | CONTINUE | SCALE | PAUSE | KILL
niche: Short dramatic stories built on a twist or emotional reversal
experiment_prefix: DR

dna:
  tone: tense, emotionally direct, cinematic
  themes:
    - betrayal and forgiveness
    - family secrets
    - moral dilemmas
  creative_constraints:
    - open with a hook in the first two seconds
    - one central conflict per story
    - end on a reversal or an unresolved question
  forbidden:
    - real, named private individuals
    - graphic violence
  director_notes: Keep narration short and spoken; avoid exposition dumps.

visual:
  style: dark cinematic illustration, high contrast, shallow depth of field
  image_prompt_suffix: cinematic lighting, 9:16, no text, no watermark

allowed_formats: [short]
default_format: short
target_duration_s:
  min_s: 30
  max_s: 60

voices:
  narrator:
    voice: en-US-GuyNeural
    rate: "+0%"
  protagonist:
    voice: en-US-JennyNeural

cta:
  style: soft
  default_text: Follow for the next chapter.

publishing:
  category_id: "24"
  default_tags: [drama, story, shorts]
  contains_synthetic_media: true
  made_for_kids: false

secret_env:
  youtube_refresh_token: YT_REFRESH_TOKEN_DRAMA
  discord_webhook: DISCORD_WEBHOOK_DRAMA
